<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorer | DKPL 2026</title>
  <meta name="theme-color" content="#07150f">
  <link rel="icon" href="../images/dkpl-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=260925c">
</head>
<body>
  <div id="siteHeader"></div>
  <main class="wrap">
    <div class="page-title">
      <h1>Match scorer</h1>
      <p class="muted">Tap the runs. Strike, overs, bowler changes and the MVP maths are handled for you. Scorer PIN required.</p>
    </div>
    <div id="app">
      <form class="card lock-card" id="pinForm">
        <h2>Scorer access</h2>
        <p class="muted">Enter the scorer PIN to update live scores. Admin PIN also works here.</p>
        <div class="field"><label for="pin">Scorer PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" required></div>
        <button class="btn btn-primary" type="submit" id="pinSubmit">Unlock</button>
        <p class="notice" id="pinError" hidden>Incorrect PIN.</p>
      </form>
    </div>
  </main>
  <div id="siteFooter"></div>

  <script src="../js/config.js?v=260925c"></script>
  <script src="../js/engine.js?v=260925c"></script>
  <script src="../js/api.js?v=260925c"></script>
  <script src="../js/store.js?v=260925c"></script>
  <script src="../js/ui.js?v=260925c"></script>
  <script src="../js/scoreboard.js?v=260925c"></script>
  <script src="../js/scorer.js?v=260925c"></script>
  <script>
    (function () {
      var form = document.getElementById("pinForm");
      if (!form || form.getAttribute("data-bound") === "yes") return;
      form.setAttribute("data-bound", "yes");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var pin = document.getElementById("pin").value.trim();
        var err = document.getElementById("pinError");
        var btn = document.getElementById("pinSubmit");
        var api = window.DKPL && window.DKPL.api;
        err.hidden = true;
        if (!api || !api.enabled()) {
          err.textContent = "Login is not ready. Confirm config.js loaded, then refresh.";
          err.hidden = false;
          return;
        }
        btn.disabled = true;
        api.auth("scorer", pin).then(function (result) {
          if (result && result.ok && result.token) {
            api.setSession(result.token, result.role);
            location.reload();
            return;
          }
          err.textContent = "Incorrect PIN.";
          err.hidden = false;
        }).catch(function () {
          err.textContent = "Could not verify PIN. Redeploy Apps Script after adding Script properties.";
          err.hidden = false;
        }).finally(function () {
          btn.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
